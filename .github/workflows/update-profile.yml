name: Update profile from learning log

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC (early morning in Toronto)
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
  workflow_dispatch:       # "Run workflow" button for an immediate refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild "Currently learning"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile from learning log"
          git push
